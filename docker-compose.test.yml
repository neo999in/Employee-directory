# Throwaway MySQL for running the backend tests against the real database engine
# (needed to exercise the FULLTEXT search).
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   cd backend
#   MYSQL_TEST_URL="mysql+pymysql://root:test@127.0.0.1:3307/employee_test?charset=utf8mb4" python -m pytest tests -v
#   docker compose -f docker-compose.test.yml down
services:
  db-test:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-ft-enable-stopword=OFF
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: employee_test
    ports:
      - "3307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ptest --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
